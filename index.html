<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101b"><title>HAYAH — Government Life Intelligence</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101b;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.demo{position:fixed;z-index:2147483647;top:max(14px,env(safe-area-inset-top));right:14px;background:#63e6c5;color:#052019;border:2px solid #b7ffec;border-radius:16px;padding:13px 17px;font:950 14px system-ui,-apple-system,"Segoe UI",Tahoma,Arial;box-shadow:0 12px 35px #000b;cursor:pointer;display:block;pointer-events:auto}.demo:active{transform:scale(.97)}.hint{position:fixed;z-index:2147483646;top:max(64px,calc(env(safe-area-inset-top) + 50px));right:14px;background:#071a2aee;color:#dbe8f1;border:1px solid #21445f;border-radius:10px;padding:7px 9px;font:800 9px system-ui;opacity:.95}@media(max-width:560px){.demo{font-size:13px;padding:12px 15px}.hint{font-size:8px}}</style></head><body><iframe id="platform" src="index-demo.html?v=25" title="HAYAH Platform"></iframe><button class="demo" onclick="window.location.assign('demo-mode.html?v=25')">DEMO 60 SEC</button><div class="hint">اضغط هنا لعرض LEAP السريع</div><script>const emoji=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/gu;function clean(doc){const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{if(emoji.test(n.nodeValue)){emoji.lastIndex=0;n.nodeValue=n.nodeValue.replace(emoji,'');}})}const frame=document.getElementById('platform');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;clean(doc);new MutationObserver(()=>clean(doc)).observe(doc.body,{subtree:true,childList:true,characterData:true})}catch(e){}});</script></body></html>
